; my board has ILI9341 even though it has 2 usb ports. for ST7789 use cyd2usb
[platformio]
default_envs = cyd

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = post:export.py
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#d57f64c8b5f2bc5b8d10d121550806eeff7b06d9
    bblanchon/ArduinoJson@7.3.0
    tzapu/WiFiManager@2.0.17
    bodmer/TJpg_Decoder@1.1.0
build_flags =
    -D USER_SETUP_LOADED=1
    -D USE_HSPI_PORT=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D SPI_READ_FREQUENCY=20000000

[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D SPI_FREQUENCY=40000000

[env:cyd]
build_flags =
    ${env.build_flags}
    -D ILI9341_2_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D SPI_FREQUENCY=40000000
