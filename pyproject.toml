[project]
name = "cydney-frames"
version = "0.3.0"
description = "backend for the cydney display"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pillow>=11,<14",
  "httpx>=0.28,<1",
  "ijson>=3.3,<4",
  "gtfs-realtime-bindings>=1.0,<3",
  "yt-dlp>=2026.3.17",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
