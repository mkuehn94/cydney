# include this in your https server block
# the curve setting is for the whole hostname. without it the ESP32 picks P-521
# and needs ~6s for the handshake
ssl_ecdh_curve X25519:prime256v1;

location = /cydney {
    return 301 /cydney/;
}

location ^~ /cydney/ {
    auth_basic "Cydney";
    auth_basic_user_file /etc/nginx/cydney.htpasswd;
    proxy_pass http://127.0.0.1:8096/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
}
